# Fly.io config for the game server. Deploy from this folder with `fly deploy`.
app = "imposter-party"
# Frankfurt, next to the Neon database (AWS Europe Central 1).
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8090
  force_https = true
  # The machine sleeps when nobody is connected and wakes (~10s) on the next request.
  # Open game sockets count as connections, so it stays up during a game.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"

# One machine only: each party lives in this server's memory, so a second machine wouldn't see it.
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
