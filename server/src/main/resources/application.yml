server:
  port: ${PORT:8090}

spring:
  application:
    name: imposter-server
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/imposter}
    username: ${DB_USER:imposter}
    password: ${DB_PASSWORD:imposter}
    # The words are read once at startup and kept in memory, so the database sits idle during games. Letting
    # idle connections close lets a free serverless Postgres (Neon) suspend instead of burning compute hours.
    hikari:
      minimum-idle: 0
      maximum-pool-size: ${DB_POOL_SIZE:3}
      idle-timeout: 30000
  flyway:
    enabled: true
