# On every push to main that touches the server: run the tests, then deploy to Dokku on the makhzanx server.
# Needs the repo secret DOKKU_SSH_KEY: a private key whose public half is added with `dokku ssh-keys:add`.
name: Server

on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/server.yml']
  workflow_dispatch:

# One deploy at a time; a newer push waits for the running one instead of cancelling it halfway.
concurrency:
  group: server-deploy
  cancel-in-progress: false

defaults:
  run:
    working-directory: server

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # The tests need no database (see src/test/resources/application-test.yml).
      - run: ./gradlew test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Dokku rejects a push from a shallow clone.
      # Dokku builds server/Dockerfile (build-dir is set to server) and swaps the container once it's up.
      - uses: dokku/github-action@v1.10.0
        with:
          branch: main # The deploy-branch set on the Dokku app.
          git_remote_url: ssh://dokku@49.12.187.249:22/imposter-party
          ssh_private_key: ${{ secrets.DOKKU_SSH_KEY }}
